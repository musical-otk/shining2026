<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>SELFTEST</title>
<style>
  body{font-family:'Apple SD Gothic Neo',sans-serif;max-width:820px;margin:0 auto;padding:20px;background:#F2F7F6;color:#16302F;}
  h1{font-size:18px;margin:0 0 4px;}
  .sub{font-size:12px;color:#4A6B69;margin-bottom:14px;}
  #summary{font-weight:700;font-size:15px;padding:10px 14px;border-radius:10px;margin-bottom:12px;}
  .ok{background:#DFF3EA;color:#12603F;}
  .bad{background:#FBE3E3;color:#8C2020;}
  .grp{font-weight:700;font-size:13px;margin:14px 0 6px;color:#12525A;}
  .row{display:flex;gap:8px;padding:5px 8px;border-bottom:1px solid #D7E4E2;font-size:13px;align-items:flex-start;}
  .tag{flex-shrink:0;width:52px;font-weight:700;}
  .p{color:#12603F;} .f{color:#8C2020;}
  .name{flex:1;}
  .detail{font-size:11px;color:#8C2020;white-space:pre-wrap;}
  iframe{width:1px;height:1px;opacity:0;position:absolute;pointer-events:none;}
</style>
</head>
<body>
<h1>✨ 샤이닝 관극 다이어리 — 셀프 검사</h1>
<div class="sub">index.html 을 iframe 으로 실제 로드해 내부 상태를 직접 검증합니다. (TEST_PLAN.md L2 계층)</div>
<div id="summary">실행 중…</div>
<div id="results"></div>
<iframe id="app" src="./index.html"></iframe>

<script>
const results = [];
let W = null;

function t(group, name, fn) { results.push({ group, name, fn }); }
function eq(a, b, msg) {
  const A = JSON.stringify(a), B = JSON.stringify(b);
  if (A !== B) throw new Error((msg ? msg + ' — ' : '') + `기대 ${B}, 실제 ${A}`);
}
function ok(cond, msg) { if (!cond) throw new Error(msg || '조건 실패'); }

// 최상위 const/let 은 window 속성이 되지 않으므로 iframe 스코프에서 eval 로 읽는다
const g = n => W.eval(n);

// 시나리오마다 저장소를 비워 순서 의존성을 없앤다.
// 단, fetch 로 받아온 schedule/events 는 남긴다 (지우면 이후 데이터 검사가 깨진다)
const KEEP = ['shining_schedule', 'shining_events'];

// ── 실제 기록 보호 ──
// 테스트는 시나리오마다 저장소를 비운다(reset). 이 페이지는 앱과 같은 주소 = 같은 저장소라서,
// 앱을 쓰는 브라우저로 열면 그 앱 기록이 지워진다. 그래서 실행 전에 통째로 백업했다가 끝나면 되돌린다.
// 도중에 창이 닫혀도 백업은 접두사 밖 키에 남아 있어, 다음에 이 페이지를 열면 그것부터 되돌린다.
const PREFIX = KEEP[0].slice(0, KEEP[0].indexOf('_') + 1);
const BACKUP_KEY = 'selftest_backup_' + PREFIX;
function snapshot(ls) {
  const o = {};
  Object.keys(ls).filter(k => k.startsWith(PREFIX)).forEach(k => { o[k] = ls.getItem(k); });
  return o;
}
function restore(ls, o) {
  Object.keys(ls).filter(k => k.startsWith(PREFIX)).forEach(k => ls.removeItem(k));
  Object.entries(o).forEach(([k, v]) => ls.setItem(k, v));
}
(function recoverLeftover() {
  const left = localStorage.getItem(BACKUP_KEY);
  if (!left) return;
  try { restore(localStorage, JSON.parse(left)); } catch (e) {}
  localStorage.removeItem(BACKUP_KEY);
})();
function guardedRun() {
  // 배포 주소에서는 한 번 더 묻는다 (배포 후 확인은 ?live=1 로 빈 브라우저에서 돌린다)
  const live = /github\.io$/.test(location.hostname) && !/[?&]live=1\b/.test(location.search);
  if (live && !window.confirm('테스트용 페이지입니다.\n이 브라우저의 관람 기록은 백업했다가 끝나면 되돌리지만,\n실행 중에 창을 닫으면 이 페이지를 다시 열어야 복구됩니다.\n\n계속할까요?')) {
    document.getElementById('summary').textContent = '실행하지 않았습니다';
    return;
  }
  const saved = snapshot(localStorage);
  localStorage.setItem(BACKUP_KEY, JSON.stringify(saved));
  try { run(); }
  finally { restore(localStorage, saved); localStorage.removeItem(BACKUP_KEY); }
}
function reset() {
  const ls = W.localStorage;
  Object.keys(ls)
    .filter(k => k.startsWith('shining_') && !KEEP.includes(k))
    .forEach(k => ls.removeItem(k));
}
function boards() { return W.getStampBoards(); }
function newBoard(name) {
  const bs = boards();
  const b = { id: W.uuid(), name: String(name), totalSlots: g('DEFAULT_SLOTS'),
              milestones: W.defaultMilestones(), currentCount: 0, history: [] };
  bs.push(b); W.saveStampBoards(bs);
  return b.id;
}
function countOf(id) { const b = boards().find(x => x.id === id); return b ? b.currentCount : null; }
function fill(id, n) { W.applyStampToBoard(id, n, '2026-12-16', '테스트'); W.applyStampToBoard._lastOverflow = 0; }
function coupon40() { return W.calcCouponCount('discount40', W.getCoupons(), boards(), W.getRecords()); }

// 스케줄에서 확실히 1회차뿐인 날 (개막일 수요일 20:00 — 프로이트 양지원·융 이한솔·쉐도우 최호승)
// / 40% 할인권 사용기간(12/22~) 안의 1회차 날
const D1 = '2026-12-16', T1 = '20:00';
const D2 = '2026-12-22', T2 = '20:00';
const span = z => z ? (z[1] - z[0] + 1) : 0;
const rowSeats = d => d.merged ? span(d.merged) : span(d.l) + span(d.m) + span(d.r);

// ── E. 개조 정합성 ────────────────────────────────────
t('E. 개조 정합성', 'ROLES 가 프로이트·융·쉐도우', () => {
  eq(g('ROLES').map(r => r.key), ['freud','jung','shadow']);
  eq(g('ROLES').map(r => r.label), ['프로이트','융','쉐도우']);
});
t('E. 개조 정합성', '배우 3·3·6명 — 쉐도우는 6명 전원 (교차 캐스팅)', () => {
  eq(g('ROLES').map(r => r.actors.length), [3, 3, 6]);
  const all = g('ROLES').flatMap(r => r.actors);
  eq(new Set(all).size, 6, '배우는 6명');
  eq(g('ROLES')[2].actors, [...g('ROLES')[0].actors, ...g('ROLES')[1].actors], '쉐도우 = 프로이트팀 + 융팀');
});
t('E. 개조 정합성', '기록 폼에 배역 입력 3개 존재 · 배우 옵션 일치', () => {
  const d = W.document;
  g('ROLES').forEach(r => {
    const el = d.getElementById('rec-' + r.key);
    ok(el, `#rec-${r.key} 없음`);
    eq([...el.options].map(o => o.value).filter(Boolean), r.actors, r.label + ' 옵션');
  });
});
t('E. 개조 정합성', '이전 작품 배역 입력이 남아있지 않음', () => {
  const d = W.document;
  ['samuel','h','henry','achilles','patroclus','hector','marco','soma','yuo','uiju','eunhui'].forEach(k =>
    ok(!d.getElementById('rec-' + k), `이전 작품 배역 입력 #rec-${k} 잔존`));
});
t('E. 개조 정합성', '저장소 네임스페이스가 shining_', () => {
  eq(g('APP_PREFIX'), 'shining_');
});
t('E. 개조 정합성', '배역 라벨 폭이 가장 긴 배역명에 맞춰져 있다', () => {
  const longest = Math.max(...g('ROLES').map(r => r.label.length));
  eq(W.roleLabelWidth(), `calc(${longest}em + 2px)`, "'전체' 칩 시작 위치가 어긋나면 안 됨");
  eq(longest, 4, '프로이트가 가장 길다');
});
t('E. 개조 정합성', '시간 선택지가 스케줄의 모든 시간을 담는다', () => {
  const W0 = W.document.getElementById('rec-time');
  W.resetTimeOptions();
  const opts = [...W0.options].map(o => o.value).filter(Boolean);
  [...new Set(W.getSchedule().map(s => s.time))].forEach(tm => ok(opts.includes(tm), tm + ' 누락'));
});

// ── U. 좌석 ───────────────────────────────────────────
const SEC_LENS = { 'B구역': [8,10,11,11,10,8,6], 'C구역': [14,15,16,17,18,21], 'D구역': [8,9,10,10,9,9] };
t('U. 좌석', '구역 B·C·D, 열 1~7 / 1~6 / 1~6', () => {
  eq(Object.keys(g('SEAT_PLAN')), ['B구역','C구역','D구역']);
  Object.entries(SEC_LENS).forEach(([f, L]) =>
    eq(g('SEAT_PLAN')[f].rows, L.map((_, i) => String(i + 1)), f + ' 열'));
});
t('U. 좌석', '열별 좌석 수 = 판독값 · 합계 220 (B 64 · C 101 · D 55)', () => {
  Object.entries(SEC_LENS).forEach(([f, L]) => {
    const P = g('SEAT_PLAN')[f];
    eq(P.rows.map(r => rowSeats(P.def[r])), L, f);
  });
  const tot = f => g('SEAT_PLAN')[f].rows.reduce((s, r) => s + rowSeats(g('SEAT_PLAN')[f].def[r]), 0);
  eq([tot('B구역'), tot('C구역'), tot('D구역')], [64, 101, 55]);
});
t('U. 좌석', '등급 R 191 · S 29 — S석 번호 구간', () => {
  let r = 0, s = 0;
  Object.entries(g('SEAT_PLAN')).forEach(([f, P]) => P.rows.forEach(row => {
    for (let n = 1; n <= rowSeats(P.def[row]); n++) (W.seatGrade(f, row, n) === 'S' ? s++ : r++);
  }));
  eq([r, s], [191, 29]);
  eq(W.seatGrade('B구역', '1', 6), 'R'); eq(W.seatGrade('B구역', '1', 7), 'S');
  eq(W.seatGrade('B구역', '7', 6), 'R', 'B 7열은 전부 R');
  eq(W.seatGrade('C구역', '6', 21), 'R', 'C 는 전석 R');
  eq(W.seatGrade('D구역', '3', 10), 'S'); eq(W.seatGrade('D구역', '5', 7), 'R');
});
t('U. 좌석', '좌석 좌표 — 공식 좌석도 판독 중심과 3px 이내', () => {
  // seating 판독 때 뽑은 실측 중심 (공식 SEAT GUIDE 1080px 좌표)
  const probe = [['B구역','1',1,275.2,768.1],['B구역','7',1,167.7,837.4],['B구역','4',11,57.0,638.0],
                 ['C구역','1',1,371.0,811.0],['C구역','6',21,836.0,919.1],
                 ['D구역','1',1,790.9,775.7],['D구역','4',10,1010.9,647.1],['D구역','6',9,1022.1,697.0]];
  probe.forEach(([f, r, n, x, y]) => {
    const [px, py] = W.seatPos(f, r, n);
    ok(Math.hypot(px - x, py - y) <= 3, `${f} ${r}열 ${n}번: (${px.toFixed(1)},${py.toFixed(1)}) vs (${x},${y})`);
  });
});
t('U. 좌석', '좌석끼리 겹치지 않고 그릴 영역 안에 있다', () => {
  const pts = [], V = g('SEAT_VIEW'), { along: CW, across: CH } = g('SEAT_CELL'), GEO = g('SEAT_GEOM');
  Object.entries(g('SEAT_PLAN')).forEach(([f, P]) => P.rows.forEach(row => {
    for (let n = 1; n <= rowSeats(P.def[row]); n++) pts.push([f, f + row + '-' + n, ...W.seatPos(f, row, n)]);
  }));
  eq(pts.length, 220);
  // 칸의 화면상 반폭·반높이 — C 는 그대로, 45° 돌린 B·D 는 (가로+세로)/2 × cos45
  const half = f => GEO[f].rot ? [(CW + CH) / 2 * Math.SQRT1_2, (CW + CH) / 2 * Math.SQRT1_2] : [CW / 2, CH / 2];
  pts.forEach(([f, k, x, y]) => { const [hx, hy] = half(f);
    ok(x - hx > V.x && x + hx < V.x + V.w && y - hy > V.y && y + hy < V.y + V.h, k + ' 영역 밖'); });
  // 같은 구역: 줄 방향·줄 사이 방향 중 하나라도 칸 크기 이상 떨어져야 한다 / 다른 구역: 대각선 이상
  const unit = v => { const l = Math.hypot(v[0], v[1]); return [v[0] / l, v[1] / l]; };
  for (let i = 0; i < pts.length; i++) for (let j = i + 1; j < pts.length; j++) {
    const [fa, ka, xa, ya] = pts[i], [fb, kb, xb, yb] = pts[j], dx = xb - xa, dy = yb - ya;
    if (fa === fb) {
      const u = unit(GEO[fa].along), v = unit(GEO[fa].across);
      ok(Math.abs(dx * u[0] + dy * u[1]) >= CW || Math.abs(dx * v[0] + dy * v[1]) >= CH, `${ka} · ${kb} 겹침`);
    } else ok(Math.hypot(dx, dy) >= Math.hypot(CW, CH), `${ka} · ${kb} 겹침`);
  }
});
t('U. 좌석', '히트맵 220칸 · 미니 좌석도는 한 칸만 강조', () => {
  W.renderHeatmap();
  const hm = W.document.getElementById('heatmap');
  eq(hm.querySelectorAll('.hm-cell').length, 220, '히트맵 좌석 칸 수');
  const mini = W.buildMiniSeat('B구역', '3', 9);
  ok(!mini.includes('${'), '치환 안 된 ${…} 가 남아 있음');
  eq((mini.match(/box-shadow/g) || []).length, 1, 'B구역 3열 9번 한 칸만');
  eq(W.buildMiniSeat('', '3', 9), '', '구역 없으면 그리지 않음');
});
t('U. 좌석', '히트맵 — 본 좌석이 색으로 칠해진다', () => {
  reset();
  W.saveRecords([{ id: 'h1', date: D1, time: T1, seatFloor: 'D구역', seatZone: '2', seatNumber: 4 },
                 { id: 'h2', date: D2, time: T2, seatFloor: 'D구역', seatZone: '2', seatNumber: 4 }]);
  W.renderHeatmap();
  const c = [...W.document.querySelectorAll('#heatmap .hm-cell')].filter(e => /v2/.test(e.className));
  eq(c.length, 1); ok(/D구역 2열 4번/.test(c[0].title), c[0].title);
});
t('U. 좌석', '좌석 입력 드롭다운(FLOOR_ROWS)이 좌석도와 일치', () => {
  eq(Object.keys(g('FLOOR_ROWS')), ['B구역','C구역','D구역']);
  Object.keys(SEC_LENS).forEach(f => eq(g('FLOOR_ROWS')[f], g('SEAT_PLAN')[f].rows, f));
  const d = W.document;
  eq([...d.getElementById('rec-floor').options].map(o => o.value).filter(Boolean), ['B구역','C구역','D구역']);
  d.getElementById('rec-floor').value = 'B구역'; W.onFloorChange();
  eq([...d.getElementById('rec-zone').options].map(o => o.value).filter(Boolean), ['1','2','3','4','5','6','7']);
  d.getElementById('rec-zone').value = '7'; W.onZoneChange();
  eq(d.getElementById('rec-num').max, '6', 'B구역 7열은 6석');
});
t('U. 좌석', '없는 좌석 번호는 저장되지 않는다', () => {
  reset();
  const d = W.document;
  W.openAddRecord(D1); d.getElementById('rec-time').value = T1;
  d.getElementById('rec-floor').value = 'C구역'; W.onFloorChange();
  d.getElementById('rec-zone').value = '1'; d.getElementById('rec-num').value = '15';
  W.saveRecord();
  eq(W.getRecords().length, 0, 'C구역 1열은 14번까지');
  d.getElementById('rec-num').value = '14';
  W.saveRecord();
  eq(W.getRecords().length, 1);
  W.closePanel('overlay-record');
});
t('U. 좌석', '가격 예시 — 좌석 등급 × 할인율', () => {
  const d = W.document;
  W.openAddRecord(D1);
  d.getElementById('rec-floor').value = 'B구역'; W.onFloorChange();
  d.getElementById('rec-zone').value = '1'; W.onZoneChange();
  d.getElementById('rec-num').value = '8'; W.updatePriceHint();
  ok(/44000 \(S석\)/.test(d.getElementById('rec-price').placeholder), d.getElementById('rec-price').placeholder);
  d.getElementById('rec-discount-type').value = '프리뷰 할인'; W.onDiscountTypeChange();
  ok(/22000 \(S석 50% 할인\)/.test(d.getElementById('rec-price').placeholder), d.getElementById('rec-price').placeholder);
  d.getElementById('rec-num').value = '1'; W.updatePriceHint();
  ok(/33000 \(R석 50% 할인\)/.test(d.getElementById('rec-price').placeholder), d.getElementById('rec-price').placeholder);
  W.closePanel('overlay-record');
});

// ── X. 교차 캐스팅 · 캘린더 배우/배역 모드 (DESIGN.md §4.1·§4.2) ─────
function setCal(actors, roles = {}, mode) {
  if (!mode) mode = Object.values(roles).some(Boolean) ? 'role' : 'actor';
  W.eval(`calMode = ${JSON.stringify(mode)}; calActors = ${JSON.stringify(actors)}; calFilter = ${JSON.stringify(Object.assign({ freud:null, jung:null, shadow:null }, roles))};`);
}
function calMatches() { return W.getSchedule().filter(s => W.matchCalFilter(s)).length; }
function hint() { W.updateCalFilterHint(); return W.document.getElementById('cal-filter-hint').textContent; }
t('X. 교차 캐스팅', 'ACTORS 6명 — 프로이트팀 3 · 융팀 3', () => {
  eq(g('ACTORS').map(a => a.name), ['최호승','양지원','유태율','이한솔','김서환','김경록']);
  eq(g('ACTORS').map(a => a.home), ['freud','freud','freud','jung','jung','jung']);
});
t('X. 교차 캐스팅', '매 회차 세 배역이 서로 다른 배우 · 쉐도우는 그날 프로이트·융이 아님', () => {
  W.getSchedule().forEach(s => {
    eq(new Set(W.castOf(s)).size, 3, `${s.date} ${s.time}`);
    ok(s.shadow !== s.freud && s.shadow !== s.jung, `${s.date} ${s.time} 쉐도우 중복`);
  });
});
t('X. 교차 캐스팅', '캐스팅 요약에 쉐도우가 빠지지 않는다 (베이스는 앞 2개만 잘랐다)', () => {
  const s = W.getSchedule().find(x => x.date === D1);
  eq(W.buildCastSummary(s), '양지원 · 이한솔 · 최호승');
});
t('X. 교차 캐스팅', '배우 모드 — 1명은 배역 무관 (최호승 15회 = 프로이트 9 + 쉐도우 6)', () => {
  setCal(['최호승']);
  eq(calMatches(), 15);
  eq(hint(), '· 최호승 15회 (프로이트 9 · 쉐도우 6) 필터 중');
  setCal([]);
  eq(calMatches(), 27, '아무도 안 고르면 전체');
  eq(hint(), '· 전체 회차 표시 중');
});
t('X. 교차 캐스팅', '배우 모드 — 여러 명은 한 명이라도 나오는 회차, 인원 제한 없음', () => {
  setCal(['최호승', '이한솔']);
  eq(calMatches(), 23);
  eq(hint(), '· 최호승·이한솔 중 1명 이상 23회 필터 중');
  setCal(['최호승', '김경록']); eq(calMatches(), 24);
  setCal(['최호승', '양지원', '유태율']); eq(calMatches(), 27, '프로이트팀 3명이면 전 회차');
  setCal(g('ACTORS').map(a => a.name)); eq(calMatches(), 27, '6명 다 골라도 됨');
  setCal([]);
});

// ── M. 도장 카드 변경 ──────────────────────────────────────
// fill() 은 n개를 이력 1건으로 찍는다. 이동은 이력 단위라 여기선 1개씩 따로 찍는다.
function stamps(id, n) {
  for (let i = 0; i < n; i++) { W.applyStampToBoard(id, 1, `2026-12-${String(16 + i).padStart(2, '0')}`, '테스트'); W.applyStampToBoard._lastOverflow = 0; }
}
t('M. 카드 변경', '혜택 단계가 안 깨지는 이동은 확인 없이 바로', () => {
  reset();
  const a = newBoard(1), b = newBoard(2);
  stamps(a, 4);
  let asked = false; W.confirm = () => { asked = true; return false; };
  ok(W.moveStampEntries(a, [0], b), '이동 성공');
  W.confirm = () => false;
  ok(!asked, '3회 혜택이 유지되므로 확인창이 없어야 함');
  eq([countOf(a), countOf(b)], [3, 1]);
  eq(coupon40(), 1, '1번 카드 3회 혜택 유지');
});

// 폼을 실제로 조작해 saveRecord / deleteCurrentRecord 경로를 그대로 태운다
function addRecordViaForm({ date, time, cast = {}, boardId = '', discount = '', paidDiff = false }) {
  const d = W.document;
  W.openAddRecord(date);
  d.getElementById('rec-time').value = time;
  // openAddRecord(date) 는 스케줄에서 캐스팅을 자동 입력한다.
  // 테스트는 의도한 값만 남기려고 전부 비운 뒤 cast 를 적용한다.
  g('ROLES').forEach(r => { d.getElementById('rec-' + r.key).value = ''; });
  Object.entries(cast).forEach(([k, v]) => { d.getElementById('rec-' + k).value = v; });
  if (discount) {
    d.getElementById('rec-discount-type').value = discount;
    ok(d.getElementById('rec-discount-type').value === discount, '할인권종 목록에 없음: ' + discount);
    W.onDiscountTypeChange();
  }
  if (paidDiff) d.getElementById('rec-paid-diff').checked = true;
  if (boardId) {
    const sel = d.getElementById('rec-stamp-board');
    sel.value = boardId;
    ok(sel.value === boardId, '도장판 선택 실패 — 목록에 없음');
    W.onRecStampBoardChange();
  }
  W.saveRecord();
  return W.getRecords();
}
function deleteRecordById(id) {
  W.confirm = () => true;                       // 삭제 확인만 승인
  W.eval('currentDetailId = ' + JSON.stringify(id));
  W.deleteCurrentRecord();
  W.confirm = () => false;                      // 기본값으로 복귀
}

// ── 실행 ──────────────────────────────────────────────
function run() {
  let pass = 0, fail = 0;
  const out = document.getElementById('results');
  let lastGroup = null;
  results.forEach(r => {
    if (r.group !== lastGroup) {
      const gEl = document.createElement('div');
      gEl.className = 'grp'; gEl.textContent = r.group;
      out.appendChild(gEl); lastGroup = r.group;
    }
    let err = null;
    try { r.fn(); pass++; } catch (e) { err = e.message || String(e); fail++; }
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `<span class="tag ${err ? 'f' : 'p'}">${err ? 'FAIL' : 'PASS'}</span>`
                  + `<span class="name">${r.name}${err ? `<div class="detail">${err}</div>` : ''}</span>`;
    out.appendChild(row);
  });
  const sum = document.getElementById('summary');
  sum.className = fail ? 'bad' : 'ok';
  sum.textContent = `RESULT ${pass} passed, ${fail} failed`;
  document.title = `SELFTEST ${pass} passed ${fail} failed`;
}

const frame = document.getElementById('app');
frame.addEventListener('load', () => {
  W = frame.contentWindow;
  // schedule.json / events.json fetch 가 끝날 시간을 준다
  const start = Date.now();
  (function wait() {
    const ready = W.getSchedule && W.getSchedule().length > 0;
    if (ready || Date.now() - start > 6000) {
      // headless 에는 confirm 에 답할 사람이 없어 영원히 멈춘다. 기본 거절로 스텁한다.
      // (COUPON_PACKS 가 비어 쿠폰팩 confirm 은 안 뜨지만, 삭제 확인 등이 있다)
      W.confirm = () => false;
      W.alert   = () => {};
      guardedRun();
    } else setTimeout(wait, 150);
  })();
});
